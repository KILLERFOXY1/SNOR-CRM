<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNOR-CRM - Helpdesk & Operations Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- App Root Container -->
    <div id="app" class="flex-1 flex flex-col">
        
        <!-- AUTH VIEW (Login / Register) -->
        <div id="auth-view" class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
            <div class="max-w-md w-full bg-slate-900/80 backdrop-blur border border-slate-800 p-8 rounded-2xl shadow-2xl">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white text-2xl font-bold mb-3 shadow-lg shadow-indigo-500/30">
                        <i class="fa-solid fa-headset"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight text-white">SNOR-CRM</h1>
                    <p class="text-sm text-slate-400 mt-1">Enterprise Helpdesk & Operations Portal</p>
                </div>

                <!-- Tabs: Login vs Register -->
                <div class="flex rounded-xl bg-slate-800 p-1 mb-6">
                    <button onclick="switchAuthTab('login')" id="tab-login" class="flex-1 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white transition">Sign In</button>
                    <button onclick="switchAuthTab('register')" id="tab-register" class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition">Register Agent</button>
                </div>

                <!-- Login Form -->
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email or Phone</label>
                        <input type="text" id="login-id" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white" placeholder="name@company.com or phone">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                        <input type="password" id="login-pass" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-indigo-600/20">Sign In to Dashboard</button>
                </form>

                <!-- Register Form -->
                <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Full Name</label>
                        <input type="text" id="reg-name" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white" placeholder="John Doe">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email</label>
                            <input type="email" id="reg-email" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white" placeholder="john@company.com">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Phone</label>
                            <input type="tel" id="reg-phone" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white" placeholder="9876543210">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password (Min 8 chars, Upper, Lower, Num, Special)</label>
                        <input type="password" id="reg-pass" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-emerald-600/20">Submit Agent Registration</button>
                </form>
                
                <div id="auth-error" class="mt-4 text-xs text-rose-400 text-center font-medium hidden"></div>
            </div>
        </div>

        <!-- PENDING APPROVAL SCREEN -->
        <div id="pending-view" class="flex-1 flex items-center justify-center p-4 bg-slate-950 hidden">
            <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center">
                <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-hourglass-half"></i>
                </div>
                <h2 class="text-xl font-bold text-white mb-2">Account Pending Approval</h2>
                <p class="text-sm text-slate-400 mb-6">Your registration has been submitted successfully. A Super Admin must approve your account before you can access SNOR-CRM.</p>
                <button onclick="logout()" class="text-sm text-indigo-400 hover:text-indigo-300 font-medium underline">Back to Login</button>
            </div>
        </div>

        <!-- DASHBOARD VIEW (Main App) -->
        <div id="dashboard-view" class="flex-1 flex flex-col hidden">
            <!-- Top Navigation Bar -->
            <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between sticky top-0 z-30">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow">
                        <i class="fa-solid fa-headset"></i>
                    </div>
                    <div>
                        <span class="text-lg font-bold tracking-tight text-white">SNOR-CRM</span>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 font-medium ml-2" id="nav-role-badge">Super Admin</span>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <div class="text-right hidden sm:block">
                        <div class="text-sm font-semibold text-white" id="nav-user-name">User</div>
                        <div class="text-xs text-slate-400" id="nav-user-email">email@domain.com</div>
                    </div>
                    <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl text-sm transition flex items-center space-x-2">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </header>

            <div class="flex-1 flex flex-col md:flex-row">
                <!-- Sidebar Navigation -->
                <aside class="w-full md:w-64 bg-slate-950 border-r border-slate-800 p-4 flex flex-row md:flex-col justify-between space-x-2 md:space-x-0 md:space-y-1 overflow-x-auto">
                    <div class="flex md:flex-col space-x-1 md:space-x-0 md:space-y-1 w-full">
                        <button onclick="switchTab('overview')" id="sidebar-overview" class="sidebar-btn flex items-center space-x-3 w-full px-4 py-3 rounded-xl text-sm font-medium bg-indigo-600 text-white transition">
                            <i class="fa-solid fa-chart-pie w-5"></i>
                            <span class="hidden md:inline">Overview</span>
                        </button>
                        <button onclick="switchTab('tickets')" id="sidebar-tickets" class="sidebar-btn flex items-center space-x-3 w-full px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-900 hover:text-white transition">
                            <i class="fa-solid fa-ticket w-5"></i>
                            <span class="hidden md:inline">Tickets & SLA</span>
                        </button>
                        <button onclick="switchTab('calls')" id="sidebar-calls" class="sidebar-btn flex items-center space-x-3 w-full px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-900 hover:text-white transition">
                            <i class="fa-solid fa-phone-volume w-5"></i>
                            <span class="hidden md:inline">Call Logs & Points</span>
                        </button>
                        <button onclick="switchTab('leaderboard')" id="sidebar-leaderboard" class="sidebar-btn flex items-center space-x-3 w-full px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-900 hover:text-white transition">
                            <i class="fa-solid fa-trophy w-5"></i>
                            <span class="hidden md:inline">Leaderboard</span>
                        </button>
                        <button onclick="switchTab('amc')" id="sidebar-amc" class="sidebar-btn flex items-center space-x-3 w-full px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-900 hover:text-white transition">
                            <i class="fa-solid fa-file-contract w-5"></i>
                            <span class="hidden md:inline">AMC Tracker</span>
                        </button>
                        <button onclick="switchTab('contacts')" id="sidebar-contacts" class="sidebar-btn flex items-center space-x-3 w-full px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-900 hover:text-white transition">
                            <i class="fa-solid fa-address-book w-5"></i>
                            <span class="hidden md:inline">Contacts Directory</span>
                        </button>
                        <button onclick="switchTab('approvals')" id="sidebar-approvals" class="sidebar-btn hidden flex items-center space-x-3 w-full px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-900 hover:text-white transition relative">
                            <i class="fa-solid fa-user-check w-5"></i>
                            <span class="hidden md:inline">Agent Approvals</span>
                            <span id="approval-badge" class="absolute right-3 bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
                        </button>
                    </div>
                </aside>

                <!-- Main Content Area -->
                <main class="flex-1 p-6 overflow-y-auto bg-slate-900" id="main-content-area">
                    <!-- Dynamic Tab Contents Injected via JS -->
                </main>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // Secure Hashed Super Admin Credentials (Plain text passwords are completely hidden)
        const SECURE_SUPER_ADMINS = [
            { email: "jayeshbhargav6000@gmail.com", phone: "8857038165", name: "Jayesh Bhargav", passHash: "7b1348821a416bf9081e7d95d18d408f657a5849800049be173bf93033f20227" },
            { email: "archita.s.parikh@gmail.com", phone: "9324504175", name: "Archita Parikh", passHash: "c00f7e4dfb1cd1e1bf1f8ed4cd3d63b064c5147be858f921ea1ea34cf69c5c7d" }
        ];

        // Helper function to safely hash password inputs on the fly using browser cryptography
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Master Call Codes Lookup
        const CALL_DESCRIPTIONS = [
            { code: "COL_01", desc: "First Follow-up Call", points: 10 },
            { code: "COL_02", desc: "AMC Renewal Discussion", points: 15 },
            { code: "COL_03", desc: "Technical Issue Resolution", points: 20 },
            { code: "COL_04", desc: "Missed Follow-up Penalty", points: -2 }
        ];

        let currentUser = JSON.parse(localStorage.getItem('snor_current_user')) || null;
        let usersList = JSON.parse(localStorage.getItem('snor_users')) || [];
        let ticketsList = JSON.parse(localStorage.getItem('snor_tickets')) || [
            { id: "TICK-1001", client: "Acme Corp", issue: "Server downtime error", status: "Open", priority: "High", agent: "Jayesh Bhargav", created: new Date().toISOString() },
            { id: "TICK-1002", client: "Globex Ltd", issue: "AMC Contract Renewal", status: "In Progress", priority: "Medium", agent: "Archita Parikh", created: new Date().toISOString() }
        ];
        let callLogsList = JSON.parse(localStorage.getItem('snor_calls')) || [];
        let amcList = JSON.parse(localStorage.getItem('snor_amc')) || [
            { id: "AMC-501", client: "Alpha Industries", expiry: "2026-12-31", status: "Active", value: "$1,200" }
        ];
        let contactsList = JSON.parse(localStorage.getItem('snor_contacts')) || [
            { name: "Robert Fox", company: "Acme Corp", phone: "555-0192", email: "robert@acme.com" }
        ];

        window.onload = function() {
            syncSuperAdmins();
            if (currentUser) {
                if (currentUser.status === 'pending') {
                    showView('pending-view');
                } else {
                    showDashboard();
                }
            } else {
                showView('auth-view');
            }
        };

        function syncSuperAdmins() {
            SECURE_SUPER_ADMINS.forEach(sa => {
                let existing = usersList.find(u => u.email === sa.email);
                if (!existing) {
                    usersList.push({ name: sa.name, email: sa.email, phone: sa.phone, passHash: sa.passHash, role: 'Super Admin', status: 'approved' });
                } else {
                    existing.role = 'Super Admin';
                    existing.status = 'approved';
                    existing.passHash = sa.passHash;
                }
            });
            localStorage.setItem('snor_users', JSON.stringify(usersList));
        }

        function showView(viewId) {
            ['auth-view', 'pending-view', 'dashboard-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
                document.getElementById('tab-login').className = "flex-1 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white transition";
                document.getElementById('tab-register').className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition";
            } else {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-register').classList.remove('hidden');
                document.getElementById('tab-register').className = "flex-1 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white transition";
                document.getElementById('tab-login').className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition";
            }
            document.getElementById('auth-error').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value;
            const inputHash = await sha256(pass);

            const user = usersList.find(u => (u.email === identifier || u.phone === identifier) && u.passHash === inputHash);
            if (!user) {
                showAuthError("Invalid credentials or user not found.");
                return;
            }

            currentUser = user;
            localStorage.setItem('snor_current_user', JSON.stringify(currentUser));

            if (user.status === 'pending') {
                showView('pending-view');
            } else {
                showDashboard();
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const pass = document.getElementById('reg-pass').value;

            const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
            if (!passRegex.test(pass)) {
                showAuthError("Password must be 8+ chars with uppercase, lowercase, number & special character.");
                return;
            }

            if (usersList.some(u => u.email === email)) {
                showAuthError("Email is already registered.");
                return;
            }

            const passHash = await sha256(pass);
            const newUser = { name, email, phone, passHash, role: 'Agent', status: 'pending' };
            usersList.push(newUser);
            localStorage.setItem('snor_users', JSON.stringify(usersList));

            currentUser = newUser;
            localStorage.setItem('snor_current_user', JSON.stringify(currentUser));
            showView('pending-view');
        }

        function showAuthError(msg) {
            const err = document.getElementById('auth-error');
            err.innerText = msg;
            err.classList.remove('hidden');
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('snor_current_user');
            showView('auth-view');
        }

        function showDashboard() {
            showView('dashboard-view');
            document.getElementById('nav-user-name').innerText = currentUser.name;
            document.getElementById('nav-user-email').innerText = currentUser.email;
            document.getElementById('nav-role-badge').innerText = currentUser.role;

            const approvalsBtn = document.getElementById('sidebar-approvals');
            if (currentUser.role === 'Super Admin') {
                approvalsBtn.classList.remove('hidden');
                updateApprovalBadge();
            } else {
                approvalsBtn.classList.add('hidden');
            }

            switchTab('overview');
        }

        function updateApprovalBadge() {
            const pendingCount = usersList.filter(u => u.status === 'pending').length;
            const badge = document.getElementById('approval-badge');
            if (pendingCount > 0) {
                badge.innerText = pendingCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        let activeTab = 'overview';
        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.className = "sidebar-btn flex items-center space-x-3 w-full px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-900 hover:text-white transition";
            });
            const activeBtn = document.getElementById(`sidebar-${tab}`);
            if (activeBtn) {
                activeBtn.className = "sidebar-btn flex items-center space-x-3 w-full px-4 py-3 rounded-xl text-sm font-medium bg-indigo-600 text-white transition";
            }
            renderTabContent();
        }

        function renderTabContent() {
            const container = document.getElementById('main-content-area');
            if (activeTab === 'overview') {
                container.innerHTML = `
                    <h2 class="text-xl font-bold text-white mb-6">Operations Overview</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        <div class="bg-slate-800 border border-slate-700/50 p-5 rounded-2xl">
                            <div class="text-slate-400 text-xs font-semibold uppercase">Total Tickets</div>
                            <div class="text-3xl font-bold text-white mt-2">${ticketsList.length}</div>
                        </div>
                        <div class="bg-slate-800 border border-slate-700/50 p-5 rounded-2xl">
                            <div class="text-slate-400 text-xs font-semibold uppercase">Active AMCs</div>
                            <div class="text-3xl font-bold text-emerald-400 mt-2">${amcList.length}</div>
                        </div>
                        <div class="bg-slate-800 border border-slate-700/50 p-5 rounded-2xl">
                            <div class="text-slate-400 text-xs font-semibold uppercase">Call Logs Recorded</div>
                            <div class="text-3xl font-bold text-indigo-400 mt-2">${callLogsList.length}</div>
                        </div>
                        <div class="bg-slate-800 border border-slate-700/50 p-5 rounded-2xl">
                            <div class="text-slate-400 text-xs font-semibold uppercase">Pending Approvals</div>
                            <div class="text-3xl font-bold text-amber-400 mt-2">${usersList.filter(u => u.status === 'pending').length}</div>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'tickets') {
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-white">Tickets & SLA Management</h2>
                        <button onclick="openNewTicketModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded-xl transition">New Ticket</button>
                    </div>
                    <div class="bg-slate-800 border border-slate-700/50 rounded-2xl overflow-hidden">
                        <table class="w-full text-left text-sm text-slate-300">
                            <thead class="bg-slate-900 text-xs uppercase text-slate-400 border-b border-slate-700">
                                <tr>
                                    <th class="p-4">ID</th>
                                    <th class="p-4">Client</th>
                                    <th class="p-4">Issue</th>
                                    <th class="p-4">Priority</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4">Assigned Agent</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700">
                                ${ticketsList.map(t => `
                                    <tr>
                                        <td class="p-4 font-mono text-indigo-400">${t.id}</td>
                                        <td class="p-4 font-semibold text-white">${t.client}</td>
                                        <td class="p-4">${t.issue}</td>
                                        <td class="p-4"><span class="px-2 py-1 rounded text-xs ${t.priority==='High'?'bg-rose-500/20 text-rose-400':'bg-amber-500/20 text-amber-400'}">${t.priority}</span></td>
                                        <td class="p-4">${t.status}</td>
                                        <td class="p-4 text-slate-400">${t.agent}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (activeTab === 'calls') {
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-white">Call Logs & Point Penalties (-2 for Missed Follow-up)</h2>
                        <button onclick="logNewCall()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded-xl transition">Log Call</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-slate-800 border border-slate-700/50 p-5 rounded-2xl">
                            <h3 class="text-sm font-semibold uppercase text-slate-400 mb-4">Master Call Codes Lookup</h3>
                            <div class="space-y-3">
                                ${CALL_DESCRIPTIONS.map(c => `
                                    <div class="flex justify-between items-center p-3 bg-slate-900 rounded-xl border border-slate-700">
                                        <div>
                                            <span class="font-mono text-indigo-400 font-bold">${c.code}</span>
                                            <div class="text-sm text-slate-200">${c.desc}</div>
                                        </div>
                                        <span class="px-3 py-1 rounded-lg text-xs font-bold ${c.points < 0 ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'}">${c.points > 0 ? '+' : ''}${c.points} pts</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="bg-slate-800 border border-slate-700/50 p-5 rounded-2xl">
                            <h3 class="text-sm font-semibold uppercase text-slate-400 mb-4">Recent Call Activity</h3>
                            <div class="space-y-3">
                                ${callLogsList.length === 0 ? '<p class="text-sm text-slate-500">No calls logged yet.</p>' : callLogsList.map(l => `
                                    <div class="p-3 bg-slate-900 rounded-xl border border-slate-700 flex justify-between items-center">
                                        <div>
                                            <div class="text-sm font-semibold text-white">${l.client}</div>
                                            <div class="text-xs text-slate-400">${l.desc}</div>
                                        </div>
                                        <span class="text-xs font-bold ${l.points < 0 ? 'text-rose-400' : 'text-emerald-400'}">${l.points > 0 ? '+' : ''}${l.points} pts</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'leaderboard') {
                container.innerHTML = `
                    <h2 class="text-xl font-bold text-white mb-6">Agent Leaderboard & Points</h2>
                    <div class="bg-slate-800 border border-slate-700/50 rounded-2xl p-6">
                        <div class="space-y-3">
                            ${usersList.filter(u => u.status === 'approved').map((u, i) => `
                                <div class="flex items-center justify-between p-4 bg-slate-900 rounded-xl border border-slate-700">
                                    <div class="flex items-center space-x-3">
                                        <span class="w-8 h-8 rounded-full bg-indigo-600/20 text-indigo-400 font-bold flex items-center justify-center text-sm">#${i+1}</span>
                                        <div>
                                            <div class="font-semibold text-white">${u.name}</div>
                                            <div class="text-xs text-slate-400">${u.role}</div>
                                        </div>
                                    </div>
                                    <span class="font-bold text-emerald-400">100 Pts</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (activeTab === 'amc') {
                container.innerHTML = `
                    <h2 class="text-xl font-bold text-white mb-6">AMC Contracts Tracker</h2>
                    <div class="bg-slate-800 border border-slate-700/50 rounded-2xl overflow-hidden">
                        <table class="w-full text-left text-sm text-slate-300">
                            <thead class="bg-slate-900 text-xs uppercase text-slate-400 border-b border-slate-700">
                                <tr>
                                    <th class="p-4">Contract ID</th>
                                    <th class="p-4">Client</th>
                                    <th class="p-4">Expiry Date</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4">Value</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700">
                                ${amcList.map(a => `
                                    <tr>
                                        <td class="p-4 font-mono text-indigo-400">${a.id}</td>
                                        <td class="p-4 font-semibold text-white">${a.client}</td>
                                        <td class="p-4">${a.expiry}</td>
                                        <td class="p-4"><span class="px-2 py-1 rounded text-xs bg-emerald-500/20 text-emerald-400">${a.status}</span></td>
                                        <td class="p-4 font-semibold text-white">${a.value}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (activeTab === 'contacts') {
                container.innerHTML = `
                    <h2 class="text-xl font-bold text-white mb-6">Contacts Directory</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${contactsList.map(c => `
                            <div class="bg-slate-800 border border-slate-700/50 p-5 rounded-2xl">
                                <div class="font-bold text-white text-base mb-1">${c.name}</div>
                                <div class="text-xs text-indigo-400 font-semibold mb-3">${c.company}</div>
                                <div class="text-sm text-slate-300 space-y-1">
                                    <div><i class="fa-solid fa-phone w-5 text-slate-500"></i> ${c.phone}</div>
                                    <div><i class="fa-solid fa-envelope w-5 text-slate-500"></i> ${c.email}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (activeTab === 'approvals' && currentUser.role === 'Super Admin') {
                const pendingUsers = usersList.filter(u => u.status === 'pending');
                container.innerHTML = `
                    <h2 class="text-xl font-bold text-white mb-6">Pending Agent Approvals</h2>
                    <div class="bg-slate-800 border border-slate-700/50 rounded-2xl p-6">
                        ${pendingUsers.length === 0 ? '<p class="text-sm text-slate-400">No pending agent registrations.</p>' : `
                            <div class="space-y-4">
                                ${pendingUsers.map(u => `
                                    <div class="p-4 bg-slate-900 rounded-xl border border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div>
                                            <div class="font-bold text-white text-base">${u.name}</div>
                                            <div class="text-xs text-slate-400">${u.email} • ${u.phone}</div>
                                        </div>
                                        <button onclick="approveAgent('${u.email}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-2 rounded-xl transition">Approve & Assign</button>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                `;
            }
        }

        function approveAgent(email) {
            const u = usersList.find(user => user.email === email);
            if (u) {
                u.status = 'approved';
                localStorage.setItem('snor_users', JSON.stringify(usersList));
                updateApprovalBadge();
                renderTabContent();
            }
        }

        function openNewTicketModal() {
            const client = prompt("Enter Client Name:");
            const issue = prompt("Enter Issue Description:");
            if (client && issue) {
                ticketsList.push({
                    id: "TICK-" + Math.floor(1000 + Math.random() * 9000),
                    client,
                    issue,
                    status: "Open",
                    priority: "Medium",
                    agent: currentUser.name,
                    created: new Date().toISOString()
                });
                localStorage.setItem('snor_tickets', JSON.stringify(ticketsList));
                renderTabContent();
            }
        }

        function logNewCall() {
            const client = prompt("Enter Client Name:");
            const codeInput = prompt("Enter Call Code (COL_01, COL_02, COL_03, or COL_04 for -2 penalty):") || "COL_01";
            const match = CALL_DESCRIPTIONS.find(c => c.code === codeInput) || CALL_DESCRIPTIONS[0];
            
            callLogsList.push({
                client,
                code: match.code,
                desc: match.desc,
                points: match.points,
                date: new Date().toISOString()
            });
            localStorage.setItem('snor_calls', JSON.stringify(callLogsList));
            renderTabContent();
        }
    </script>
</body>
</html>
